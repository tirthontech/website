[build]
  command = "pnpm install && pnpm run build"
  publish = "dist"

# Canonical domain redirects — all non-canonical variants → https://tirthontech.com
[[redirects]]
  from = "https://www.tirthontech.com/*"
  to = "https://tirthontech.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://www.tirthontech.com/*"
  to = "https://tirthontech.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "http://tirthontech.com/*"
  to = "https://tirthontech.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
